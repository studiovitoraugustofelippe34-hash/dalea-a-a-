```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estabelecimento - Dalea Açaí</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        .imagem-estabelecimento {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .imagem-estabelecimento img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;

            /* Borda da imagem */
            border: 5px solid #4B0082;
            border-radius: 15px;
        }

        /* Vídeo acrescentado */
        .video-estabelecimento {
            width: 100%;
            padding: 10px;
            background: #000;
        }

        .video-estabelecimento video {
            display: block;
            width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border: 5px solid #4B0082;
            border-radius: 15px;
        }

        /* Mapa de localização acrescentado */
        .localizacao-estabelecimento {
            width: 100%;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .localizacao-estabelecimento h2 {
            color: #c084fc;
            text-align: center;
            margin-bottom: 15px;
        }

        .localizacao-estabelecimento p {
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .mapa-estabelecimento {
            width: 100%;
            height: 450px;
            border: 5px solid #4B0082;
            border-radius: 15px;
            overflow: hidden;
        }

        .mapa-estabelecimento iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .botao-rota {
            display: block;
            width: fit-content;
            max-width: 100%;
            margin: 20px auto 0;
            padding: 14px 24px;
            background: #4B0082;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
        }

        .botao-rota:hover {
            background: #6a0dad;
        }

        @media (max-width: 600px) {
            .mapa-estabelecimento {
                height: 350px;
            }

            .localizacao-estabelecimento {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="imagem-estabelecimento">
        <img src="./14.jpg"
             alt="Imagem do estabelecimento Dalea Açaí">
    </div>

    <!-- Vídeo do estabelecimento -->
    <div class="video-estabelecimento">
        <video controls>
            <source src="./dalea video.mp4" type="video/mp4">
            Seu navegador não suporta a reprodução de vídeos.
        </video>
    </div>

    <!-- Localização do Dalea Açaí -->
    <section class="localizacao-estabelecimento">

        <h2>Localização do Dalea Açaí</h2>

        <p>
            <strong>Dalea Açaí Rubinéia</strong><br>
            Rua Mário Lago, 572<br>
            Rubinéia - SP, CEP 15790-000
        </p>

        <!-- Mapa interativo do Google Maps -->
        <div class="mapa-estabelecimento">
            <iframe
                src="https://maps.google.com/maps?q=Rua%20M%C3%A1rio%20Lago%2C%20572%2C%20Rubin%C3%A9ia%2C%20SP&t=&z=17&ie=UTF8&iwloc=&output=embed"
                title="Mapa de localização do Dalea Açaí em Rubinéia SP"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Abrir rota no Google Maps -->
        <a
            class="botao-rota"
            href="https://www.google.com/maps/dir/?api=1&destination=Rua%20M%C3%A1rio%20Lago%2C%20572%2C%20Rubin%C3%A9ia%2C%20SP"
            target="_blank"
            rel="noopener noreferrer">
            Como chegar ao Dalea Açaí
        </a>

    </section>

</body>
</html>
```
